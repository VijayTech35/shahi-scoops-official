name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm start &
      - run: sleep 3
      - run: npm run test:integration
      - name: Cleanup
        if: always()
        run: pkill -f "node index.js" || true

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run lint 2>/dev/null || echo "no lint configured"

  build-images:
    runs-on: ubuntu-latest
    needs: [test-server, test-web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shahi-api:latest ./server
      - run: docker build -t shahi-web:latest .
